<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Budget Calculator</title>
<style>
  .hidden { display: none; }
  .disabled {
    opacity: 0.5;
    pointer-events: none;
  }
</style>
</head>
<body>

<h3>National Budget:</h3>
<input id="budget" type="number" value="60000000000">

<h3>Population:</h3>
<input id="population" type="number" value="20000000">

<button id="calcBtn">Calculate</button>

<p id="result"></p>

<button id="level1Btn" class="disabled">Level 1 — National Security (Mandatory)</button>

<div id="level1Content" class="hidden">
  <h3>Level 1 details</h3>
  <p>Здесь будет продолжение для Level 1…</p>
</div>

<script>
document.getElementById("calcBtn").addEventListener("click", function () {
    const budget = parseFloat(document.getElementById("budget").value);
    const population = parseFloat(document.getElementById("population").value);

    if (budget > 0 && population > 0) {
        const result = (budget / population).toFixed(2);
        document.getElementById("result").textContent = "Budget per citizen: " + result;

        // Активируем Level 1 кнопку
        const levelBtn = document.getElementById("level1Btn");
        levelBtn.classList.remove("disabled");
    }
});

document.getElementById("level1Btn").addEventListener("click", function () {
    const content = document.getElementById("level1Content");
    content.classList.toggle("hidden");
});
</script>

</body>
</html>
