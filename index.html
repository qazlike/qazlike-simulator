<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QazLike Simulator 1.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>QazLike Simulator 1.1</h1>

    <div class="container">
        <h2>Initial Data</h2>

        <label for="budget">National Budget:</label>
        <input type="number" id="budget" placeholder="Enter total budget">

        <label for="population">Population:</label>
        <input type="number" id="population" placeholder="Enter population">

        <button id="calculateBtn">Calculate</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
